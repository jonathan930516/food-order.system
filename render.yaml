services:
  - type: web
    name: food-order-system
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-order-db
          property: connectionString
databases:
  - name: food-order-db
    plan: free
    databaseName: food_order
    user: food_order
